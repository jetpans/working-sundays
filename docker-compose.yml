services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: runtime
    container_name: working-sundays-server
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=false
      - PORT=5000
      - WORKSPACE_ROOT=/app
      - RUNS_DIR=/app/api/jobs
      - LEGACY_RUNS_DIR=/app/api/runs
      - AUTH_DIR=/app/api/auth
      - AUTH_USERS_FILE=/app/api/auth/users.json
      - AUTH_JWT_SECRET_FILE=/app/api/auth/.jwt_secret
      - JAVA_BIN=java
      - JAVA_JAR=/app/api/algorithm.jar
    volumes:
      - ./app/api/jobs:/app/api/jobs
      - ./app/api/runs:/app/api/runs
      - ./app/api/auth:/app/api/auth
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: working-sundays-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - server
    restart: unless-stopped
